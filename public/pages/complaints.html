<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaints — CampusMate</title>
    <style>
        body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: #f3f4f6; display: flex; height: 100vh; color: #1f2937; }
        aside { width: 250px; background: #0f172a; color: white; padding: 24px; display: flex; flex-direction: column; }
        aside h2 { color: #60a5fa; margin-top: 0; font-size: 24px; }
        aside a { color: #9ca3af; text-decoration: none; padding: 12px 0; display: block; transition: color 0.2s; }
        aside a:hover, aside a.active { color: white; font-weight: 600; }
        main { flex: 1; padding: 40px; overflow-y: auto; }
        .header { margin-bottom: 30px; }
        .header h1 { margin: 0; font-size: 28px; }
        #complaintForm { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 30px; border-top: 4px solid #f59e0b; }
        .input-group { display: flex; gap: 15px; margin-bottom: 15px; }
        input, select, textarea { flex: 1; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-family: inherit; outline: none; }
        button { background: #f59e0b; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        button:hover { background: #d97706; }
        #formMessage { margin-top: 15px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>
    <aside>
        <h2>◆ CampusMate</h2>
        <nav style="margin-top: 30px; flex: 1;">
            <a href="/pages/dashboard.html">📊 Dashboard</a>
            <a href="/pages/lost-found.html">🔍 Lost & Found</a>
            <a href="/pages/events.html">📅 Events</a>
            <a href="/pages/smart-wait.html">⏱️ Smart Wait</a>
            <a href="/pages/complaints.html" class="active">⚠️ Complaints</a>
            <a href="/pages/assistant.html">🤖 Assistant</a>
            <a href="/pages/sos.html" style="color: #fca5a5;">🚨 SOS</a>
        </nav>
        <a href="#" id="logoutBtn" style="color: #ef4444; font-weight: 600; text-decoration: none;" onclick="localStorage.clear(); window.location.href='/pages/login.html'">Logout</a>
    </aside>

    <main>
        <div class="header">
            <h1>Help Desk & Complaints</h1>
            <p style="color: #6b7280; margin-top: 5px;">Submit facility issues directly to the administration.</p>
        </div>
        
        <form id="complaintForm">
            <div class="input-group">
                <input type="text" id="cTitle" placeholder="Issue Title (e.g., Broken AC in Lib)" required autocomplete="off">
                <select id="cCategory" required>
                    <option value="" disabled selected>Select Category</option>
                    <option value="IT">IT & WiFi</option>
                    <option value="Maintenance">Maintenance</option>
                    <option value="Cleanliness">Cleanliness</option>
                </select>
            </div>
            <textarea id="cDesc" placeholder="Describe the issue in detail..." rows="4" required></textarea>
            <div style="margin-top: 15px; display: flex; justify-content: space-between; align-items: center;">
                <div id="formMessage"></div>
                <button type="submit">Submit Ticket</button>
            </div>
        </form>
    </main>

    <script>
        document.getElementById("complaintForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const token = localStorage.getItem("campusx_token");
            const msgBox = document.getElementById("formMessage");
            
            if (!token) {
                window.location.href = "/pages/login.html";
                return;
            }

            const title = document.getElementById("cTitle").value;
            const category = document.getElementById("cCategory").value;
            const description = document.getElementById("cDesc").value;

            msgBox.textContent = "Submitting...";
            msgBox.style.color = "#f59e0b";

            try {
                const res = await fetch("/api/complaints", {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json", 
                        "Authorization": `Bearer ${token}` 
                    },
                    body: JSON.stringify({ title, category, description })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    msgBox.textContent = "✅ Complaint submitted successfully!";
                    msgBox.style.color = "#10b981";
                    e.target.reset();
                    setTimeout(() => msgBox.textContent = "", 3000);
                } else {
                    msgBox.textContent = "❌ Error: " + data.message;
                    msgBox.style.color = "#ef4444";
                }
            } catch (error) {
                msgBox.textContent = "❌ Connection failed.";
                msgBox.style.color = "#ef4444";
            }
        });
    </script>
</body>
</html>
