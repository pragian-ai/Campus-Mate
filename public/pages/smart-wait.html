<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Wait — CampusX</title>
  </head>
  <body style="display: flex; margin: 0; font-family: sans-serif; background: #f7f7f5;">
    
    <!-- Sidebar -->
    <aside style="width: 250px; background: #151619; color: white; height: 100vh; padding: 20px; position: sticky; top: 0;">
      <h2>◆ CampusX</h2>
      <ul style="list-style: none; padding: 0; margin-top: 30px; line-height: 2;">
        <li><a href="/pages/dashboard.html" style="color: #aaa; text-decoration: none;">Dashboard</a></li>
        <li><a href="/pages/lost-found.html" style="color: #aaa; text-decoration: none;">Lost & Found</a></li>
        <li><a href="/pages/events.html" style="color: #aaa; text-decoration: none;">Events</a></li>
        <li><a href="/pages/smart-wait.html" style="color: white; text-decoration: none;">Smart Wait</a></li>
      </ul>

    <!-- Main Content -->
    <main style="flex: 1; padding: 40px;">
      <h1>Smart Wait ⏱</h1>
      <p style="color: #666; margin-bottom: 30px;">Check live queue times across campus before you go.</p>
      
      <!-- Queues Grid -->
      <div id="queuesFeed" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; max-width: 1000px;">
        <p>Loading live queue data...</p>
      </div>
    </main>

    <script src="/js/smart-wait.js"></script>
