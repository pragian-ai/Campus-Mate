<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Wait — CampusMate</title>
    <style>
        body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: #f3f4f6; display: flex; height: 100vh; color: #1f2937; }
        aside { width: 250px; background: #111827; color: white; padding: 24px; display: flex; flex-direction: column; }
        aside h2 { color: #60a5fa; margin-top: 0; font-size: 24px; }
        aside a { color: #9ca3af; text-decoration: none; padding: 12px 0; display: block; transition: color 0.2s; }
        aside a:hover, aside a.active { color: white; font-weight: 600; }
        main { flex: 1; padding: 40px; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header h1 { margin: 0; font-size: 28px; }
        #queuesFeed { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .queue-card { background: #ebebeb; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #e5e7eb; }
        .queue-card h4 { margin: 0 0 15px 0; font-size: 20px; border-bottom: 1px solid #e5e7eb; padding-bottom: 10px; }
        .stat { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 15px; }
        .badge { padding: 4px 10px; border-radius: 9999px; font-size: 12px; font-weight: bold; }
        .status-busy { background: #fee2e2; color: #991b1b; }
        .status-normal { background: #dcfce7; color: #166534; }
    </style>
</head>
<body>
    <aside>
        <h2>◆ CampusX</h2>
        <nav style="margin-top: 30px;">
            <a href="/pages/dashboard.html">📊 Dashboard</a>
            <a href="/pages/lost-found.html">🔍 Lost & Found</a>
            <a href="/pages/events.html">📅 Events</a>
            <a href="/pages/smart-wait.html" class="active">⏱️ Smart Wait</a>
            <a href="/pages/complaints.html">⚠️ Complaints</a>
            <a href="/pages/assistant.html">🤖 Assistant</a>
            <a href="/pages/sos.html" style="color: #fca5a5;">🚨 SOS</a>
        </nav>
    </aside>
    <main>
        <div class="header">
            <h1>Live Queue Tracking</h1>
        </div>
        <div id="queuesFeed"><p>Loading live data...</p></div>
    </main>
    <script src="/js/smart-wait.js"></script>
</body>
</html>
