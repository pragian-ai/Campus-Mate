<!DOCTYPE html>
<html>
<head>

    <title>Helpline Chatbot</title>

    <style>

        body {
            margin: 0;
            font-family: Arial;
            background: #f5f5f5;
        }

        /* Chatbot */

        .chatbot {
            position: fixed;
            right: 25px;
            bottom: 25px;
        }

        /* Message bubble */

        .message-bubble {
            position: absolute;
            right: 75px;
            bottom: 15px;

            background: white;
            padding: 10px 18px;

            border-radius: 20px;

            box-shadow: 0 3px 15px rgba(0,0,0,0.2);

            font-weight: bold;

            animation: blink 1.5s infinite;
        }

        @keyframes blink {

            50% {
                opacity: 0.5;
            }

        }

        /* black button */

        .chat-button {

            position: relative;

            width: 65px;
            height: 65px;

            border-radius: 50%;

            border: none;

            background: #130c0d;

            color: white;

            font-size: 28px;

            cursor: pointer;

            animation: glow 1.5s infinite;

        }

        @keyframes glow {

            50% {
                transform: scale(1.08);

                box-shadow:
                0 0 20px rgb(12, 7, 7),
                0 0 40px rgb(33, 22, 22);
            }

        }

        /* Sparkles */

        .chat-button::before {

            content: "✦";

            position: absolute;

            top: -10px;
            right: -5px;

            font-size: 22px;

            animation: sparkle 1s infinite;

        }

        .chat-button::after {

            content: "✧";

            position: absolute;

            bottom: 0;
            left: -7px;

            font-size: 18px;

            animation: sparkle 1.2s infinite;

        }

        @keyframes sparkle {

            50% {
                transform: scale(1.5);
                opacity: 1;
            }

            100% {
                opacity: 0.3;
            }

        }

        /* Chat window */

        .chat-window {

            display: none;

            position: absolute;

            right: 0;
            bottom: 80px;

            width: 330px;

            background: white;

            border-radius: 15px;

            overflow: hidden;

            box-shadow: 0 5px 25px rgba(0,0,0,0.3);

        }

        /* Header */

        .chat-header {

            background: #100a0a;

            color: white;

            padding: 18px;

            font-size: 18px;

            font-weight: bold;

        }

        /* Chat area */

        .chat-body {

            height: 250px;

            padding: 15px;

            overflow-y: auto;

        }

        /* Bot message */

        .bot-message {

            background: #eeeeee;

            padding: 10px;

            border-radius: 10px;

            margin-bottom: 10px;

            width: fit-content;

            max-width: 80%;

        }

        /* User message */

        .user-message {

            background: #1c0e0f;

            color: white;

            padding: 10px;

            border-radius: 10px;

            margin: 10px 0 10px auto;

            width: fit-content;

            max-width: 80%;

        }

        /* Input */

        .chat-input {

            display: flex;

            border-top: 1px solid #ddd;

        }

        .chat-input input {

            flex: 1;

            padding: 13px;

            border: none;

            outline: none;

        }

        .chat-input button {

            background: #210c0c;

            color: white;

            border: none;

            padding: 13px 18px;

            cursor: pointer;

        }

    </style>

</head>


<body>


<div class="chatbot">


    <!-- Message bubble -->

    <div class="message-bubble" id="messageBubble">

        💬 Message

    </div>


    <!-- Chat window -->

    <div class="chat-window" id="chatWindow">


        <div class="chat-header">

            🎧 Helpline Assistant

        </div>


        <!-- YAHAN MESSAGES AAYENGE -->

        <div class="chat-body" id="chatBody">

            <div class="bot-message">

                👋 Hello! How can I help you?

            </div>

        </div>


        <!-- INPUT -->

        <div class="chat-input">

            <input
                type="text"
                id="userInput"
                placeholder="Type your message..."
                onkeydown="checkEnter(event)"
            >

            <button onclick="sendMessage()">

            </button>

        </div>


    </div>


    <!-- Chat button -->

    <button
        class="chat-button"
        onclick="openChat()"
    >

        💬

    </button>


</div>



<script>


/* Open / close chat */

function openChat() {

    let chat =
        document.getElementById("chatWindow");

    let bubble =
        document.getElementById("messageBubble");


    if (chat.style.display === "block") {

        chat.style.display = "none";

        bubble.style.display = "block";

    }

    else {

        chat.style.display = "block";

        bubble.style.display = "none";

    }

}



/* Send message */

function sendMessage() {

    let input =
        document.getElementById("userInput");

    let message =
        input.value.trim();


    if (message === "") {

        return;

    }


    let chatBody =
        document.getElementById("chatBody");


    /* Student message */

    let userMessage =
        document.createElement("div");


    userMessage.className =
        "user-message";


    userMessage.innerText =
        message;


    chatBody.appendChild(userMessage);


    /* Clear input */

    input.value = "";


    /* Scroll down */

    chatBody.scrollTop =
        chatBody.scrollHeight;

}



/* Enter key */

function checkEnter(event) {

    if (event.key === "Enter") {

        sendMessage();

    }

}


</script>
<script src="../js/back.js"></script>


</body>
</html>
