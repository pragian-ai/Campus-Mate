<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Command Center — CampusMate</title>
    <style>
        body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: #0f172a; display: flex; height: 100vh; color: #f8fafc; }
        aside { width: 250px; background: #020617; padding: 24px; border-right: 1px solid #1e293b; display: flex; flex-direction: column; }
        aside h2 { color: #ef4444; margin-top: 0; font-size: 24px; }
        aside a { color: #94a3b8; text-decoration: none; padding: 12px 16px; display: block; border-radius: 8px; margin-bottom: 4px; transition: 0.2s;}
        aside a:hover, aside a.active { background: #1e293b; color: white; font-weight: 600; border-left: 3px solid #ef4444; }
        main { flex: 1; padding: 40px; overflow-y: auto; }
        
        /* Dashboard Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: #1e293b; padding: 24px; border-radius: 12px; border-top: 4px solid #3b82f6; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .stat-card.alert { border-top-color: #ef4444; }
        .stat-card.warning { border-top-color: #f59e0b; }
        .stat-card h3 { margin: 0 0 10px 0; color: #94a3b8; font-size: 14px; text-transform: uppercase; }
        .stat-card p { margin: 0; font-size: 32px; font-weight: bold; color: white; }
        
        /* SOS Feed */
        .alert-card { background: #1e293b; padding: 20px; border-radius: 12px; border-left: 4px solid #ef4444; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .map-btn { background: #3b82f6; color: white; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>
    <aside>
        <h2>🛡️ Admin Panel</h2>
        <nav style="margin-top: 30px; flex: 1;">
            <a href="/pages/admin.html" class="active">📊 Overview & SOS</a>
            <a href="/pages/admin-events.html">📅 Manage Events</a>
            <a href="/pages/admin-lost-found.html">🔍 Lost & Found</a>
            <a href="/pages/admin-complaints.html">⚠️ Complaints</a>
        </nav>
        <a href="/pages/login.html" onclick="localStorage.clear()" style="color: #ef4444; margin-top: auto;">Logout</a>
    </aside>

    <main>
        <h1 style="margin-top: 0; border-bottom: 1px solid #1e293b; padding-bottom: 20px;">System Overview</h1>
        
        <div class="grid">
            <div class="stat-card alert">
                <h3>Active SOS Alerts</h3>
                <p id="sosCount">0</p>
            </div>
            <div class="stat-card warning">
                <h3>Open Complaints</h3>
                <p id="complaintCount">0</p>
            </div>
            <div class="stat-card">
                <h3>System Status</h3>
                <p style="color: #10b981; font-size: 24px;">Online</p>
            </div>
        </div>

        <h2 style="color: #ef4444; margin-bottom: 20px;">🚨 Live Emergency Feed</h2>
        <div id="alertsFeed"><p style="color: #64748b;">Scanning for emergencies...</p></div>
    </main>

    <script src="/js/admin.js"></script>
</body>
</html>
