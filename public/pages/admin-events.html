<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Events — Admin</title>
    <style>
        body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: #0f172a; display: flex; height: 100vh; color: #f8fafc; }
        aside { width: 250px; background: #020617; padding: 24px; border-right: 1px solid #1e293b; display: flex; flex-direction: column; }
        aside h2 { color: #ef4444; margin-top: 0; font-size: 24px; }
        aside a { color: #94a3b8; text-decoration: none; padding: 12px 16px; display: block; border-radius: 8px; margin-bottom: 4px; }
        aside a:hover, aside a.active { background: #1e293b; color: white; font-weight: 600; border-left: 3px solid #ef4444; }
        main { flex: 1; padding: 40px; overflow-y: auto; }
        .form-card { background: #1e293b; padding: 24px; border-radius: 12px; border-top: 4px solid #10b981; margin-bottom: 30px; }
        .input-group { display: flex; gap: 15px; margin-bottom: 15px; }
        input, textarea { flex: 1; padding: 12px; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: white; font-family: inherit; }
        button { background: #10b981; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <aside>
        <h2>🛡️ Admin Panel</h2>
        <nav style="margin-top: 30px; flex: 1;">
            <a href="/pages/admin.html">📊 Overview & SOS</a>
            <a href="/pages/admin-events.html" class="active">📅 Manage Events</a>
            <a href="/pages/admin-lost-found.html">🔍 Lost & Found</a>
            <a href="/pages/admin-complaints.html">⚠️ Complaints</a>
        </nav>
        <a href="/pages/login.html" onclick="localStorage.clear()" style="color: #ef4444; margin-top: auto;">Logout</a>
    </aside>
    <main>
        <h1>Publish New Event</h1>
        <div class="form-card">
            <form id="eventForm">
                <div class="input-group">
                    <input type="text" id="eTitle" placeholder="Event Title" required>
                    <input type="text" id="eLocation" placeholder="Location" required>
                </div>
                <div class="input-group">
                    <input type="date" id="eDate" required>
                    <input type="time" id="eTime" required>
                </div>
                <textarea id="eDesc" placeholder="Event Description..." rows="3" style="width: 100%; box-sizing: border-box; margin-bottom: 15px;"></textarea>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div id="msg"></div>
                    <button type="submit">Publish Event</button>
                </div>
            </form>
        </div>
    </main>
    <script>
        document.getElementById("eventForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const token = localStorage.getItem("campusx_token");
            const msg = document.getElementById("msg");
            
            const payload = {
                title: document.getElementById("eTitle").value,
                location: document.getElementById("eLocation").value,
                date: document.getElementById("eDate").value,
                time: document.getElementById("eTime").value,
                description: document.getElementById("eDesc").value
            };

            try {
                const res = await fetch("/api/events", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.success) {
                    msg.innerHTML = "✅ Event Published!";
                    msg.style.color = "#10b981";
                    e.target.reset();
                } else {
                    msg.innerHTML = "❌ " + data.message;
                    msg.style.color = "#ef4444";
                }
            } catch (err) {
                msg.innerHTML = "❌ Connection error.";
                msg.style.color = "#ef4444";
            }
        });
    </script>
</body>
</html>
