<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistant — CampusMate</title>
    <style>
        
        body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: #f4f7fe; display: flex; height: 100vh; color: #1e293b; }
        aside { width: 250px; background: #0f172a; color: white; padding: 24px; display: flex; flex-direction: column; }
        aside h2 { color: #3b82f6; margin-top: 0; font-size: 24px; letter-spacing: 1px; }
        aside a { color: #94a3b8; text-decoration: none; padding: 12px 16px; display: block; border-radius: 8px; margin-bottom: 5px; transition: 0.2s; font-weight: 500; }
        aside a:hover, aside a.active { background: #1e293b; color: white; font-weight: 600; border-left: 3px solid #3b82f6; }
        
        main { flex: 1; padding: 40px; display: flex; flex-direction: column; align-items: center; overflow-y: auto; }
        .header { width: 100%; max-width: 600px; margin-bottom: 10px; }
        .header h1 { margin: 0 0 5px 0; font-size: 32px; color: #0f172a; }
        
        .chat-container { background: white; width: 100%; max-width: 600px; flex: 1; border-radius: 16px; border: 1px solid #e2e8f0; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.03); max-height: 75vh; }
        #chatBox { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; background: #f8fafc; }
        
        /* Message Bubble Styles */
        .message { padding: 12px 16px; border-radius: 16px; max-width: 80%; font-size: 14px; line-height: 1.5; }
        .bot-message { align-self: flex-start; background: #e2e8f0; color: #1e293b; border-bottom-left-radius: 4px; }
        .user-message { align-self: flex-end; background: #3b82f6; color: white; border-bottom-right-radius: 4px; }

        /* Modern Input Form */
        #chatForm { display: flex; padding: 16px; background: white; border-top: 1px solid #e2e8f0; gap: 10px; align-items: center; }
        #userInput { flex: 1; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 24px; outline: none; font-family: inherit; font-size: 14px; background: #f8fafc; transition: 0.2s; }
        #userInput:focus { border-color: #3b82f6; background: white; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        #chatForm button { background: #3b82f6; color: white; padding: 10px 20px; border: none; border-radius: 24px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; }
        #chatForm button:hover { background: #2563eb; }
    </style>
</head>
<body>
    <aside>
        <h2>◆ CampusMate</h2>
        <nav style="margin-top: 30px; flex: 1;">
            <a href="/pages/dashboard.html">📊 Dashboard</a>
            <a href="/pages/lost-found.html">🔍 Lost & Found</a>
            <a href="/pages/events.html">📅 Events</a>
            <a href="/pages/smart-wait.html">⏱️ Smart Wait</a>
            <a href="/pages/complaints.html">⚠️ Complaints</a>
            <a href="/pages/assistant.html" class="active">🤖 Assistant</a>
            <a href="/pages/sos.html" style="color: #fca5a5; margin-top: 20px;">🚨 SOS</a>
        </nav>
        <a href="#" id="logoutBtn" style="color: #ef4444; font-weight: 600; text-decoration: none;" onclick="localStorage.clear(); window.location.href='/pages/login.html'">Logout</a>
    </aside>
    
    <main>
        <div class="header">
            <h1>Campus Assistant 🤖</h1>
        </div>
        <div class="chat-container">
            <div id="chatBox">
                <div class="message bot-message">
                    Hi! Ask me about the library, canteen, Wi-Fi, or events!
                </div>
            </div>
            <form id="chatForm">
                <input type="text" id="userInput" placeholder="Ask a question..." autocomplete="off" required />
                <button type="submit">Send</button>
            </form>
        </div>
    </main>
    <script src="/js/assistant.js"></script>
</body>
</html>
