<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — CampusX</title>
    <link rel="stylesheet" href="/css/auth.css" />
  </head>
  <body>
    <div class="auth-container">
      <h2>Welcome Back</h2>
      <p>Log in to your CampusX dashboard.</p>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="email">College Email</label>
          <input type="email" id="email" required placeholder="student@campusx.edu" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="••••••••" />
        </div>

        <button type="submit">Log In</button>
      </form>
      
      <p class="auth-links">
        Don't have an account? <a href="/pages/signup.html">Sign up here</a>
      </p>
    </div>

    <!-- This links your frontend to the API! -->
    <script src="/js/auth.js"></script>
  </body>
</html>
