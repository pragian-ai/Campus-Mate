<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — CampusMate</title>
    <style>
        body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: #f3f4f6; display: flex; align-items: center; justify-content: center; height: 100vh; color: #1f2937; }
        .auth-container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; border-top: 4px solid #2563eb; }
        h1 { margin: 0 0 20px 0; font-size: 24px; text-align: center; color: #111827; }
        .input-group { margin-bottom: 15px; }
        input { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; box-sizing: border-box; font-family: inherit; }
        button { width: 100%; background: #2563eb; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        button:hover { background: #1d4ed8; }
        .toggle { text-align: center; margin-top: 20px; font-size: 14px; color: #6b7280; cursor: pointer; }
        .toggle span { color: #2563eb; font-weight: 600; }
        #msg { text-align: center; margin-top: 15px; font-size: 14px; min-height: 20px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="auth-container">
        <h1 id="formTitle">Student Login</h1>
        
        <form id="authForm">
            <div class="input-group hidden" id="nameGroup">
                <input type="text" id="name" placeholder="Full Name">
            </div>
            <div class="input-group">
                <input type="email" id="email" placeholder="Campus Email" required autocomplete="off">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <button type="submit" id="submitBtn">Login</button>
            <div id="msg"></div>
        </form>

        <div class="toggle" id="toggleMode">Need an account? <span>Sign Up</span></div>
        <div style="text-align: center; margin-top: 15px; font-size: 12px;">
            <a href="/pages/admin-login.html" style="color: #ef4444; text-decoration: none;">Admin Gateway</a>
        </div>
    </div>
    <script src="/js/login.js"></script>
</body>
</html>
