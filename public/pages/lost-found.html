<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lost & Found — CampusMate</title>
  </head>
  <body style="display: flex; margin: 0; font-family: sans-serif; background: #f7f7f5;">
    
    <!-- Sidebar -->
    <aside style="width: 250px; background: #151619; color: white; height: 100vh; padding: 20px;">
      <h2>◆ CampusX</h2>
      <ul style="list-style: none; padding: 0; margin-top: 30px; line-height: 2;">
        <li><a href="/pages/dashboard.html" style="color: #aaa; text-decoration: none;">Dashboard</a></li>
            <li><a href="/pages/lost-found.html" style="color: white; text-decoration: none;">Lost & Found</a></li>
            <li><a href="/pages/events.html" style="color: #aaa; text-decoration: none;">Events</a></li>
            <li><a href="/pages/smart-wait.html" style="color: #aaa; text-decoration: none;">Smart Wait</a></li>
            <li><a href="/pages/complaints.html" style="color: #aaa; text-decoration: none;">Complaints</a></li>
            <li style="margin-top: 50px;"><button id="logoutBtn" style="background: red; color: white; border: none; padding: 10px; cursor: pointer; border-radius: 5px;">Logout</button></li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main style="flex: 1; padding: 40px;">
      <h1>Lost & Found</h1>
      
      <!-- Report Form -->
      <div style="background: white; padding: 20px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 40px; max-width: 600px;">
        <h3>Report an Item</h3>
        <form id="reportForm" style="display: flex; flex-direction: column; gap: 15px;">
          
          <select id="type" required style="padding: 10px;">
            <option value="lost">I lost something</option>
            <option value="found">I found something</option>
          </select>

          <input type="text" id="title" placeholder="Item Name (e.g., Blue Milton Bottle)" required style="padding: 10px;" />
          
          <input type="text" id="location" placeholder="Location (e.g., Block B, Room 204)" required style="padding: 10px;" />
          
          <select id="category" style="padding: 10px;">
            <option value="electronics">Electronics</option>
            <option value="documents">ID/Documents</option>
            <option value="accessories">Accessories</option>
            <option value="other">Other</option>
          </select>

          <textarea id="description" placeholder="Any extra details?" style="padding: 10px; height: 80px;"></textarea>

          <button type="submit" style="background: #151619; color: white; padding: 12px; border: none; border-radius: 6px; cursor: pointer;">Submit Report</button>
        </form>
      </div>

      <!-- Items Feed -->
      <h3>Recent Reports</h3>
      <div id="itemsFeed" style="display: grid; gap: 15px; max-width: 600px;">
        <!-- Items will be injected here by JavaScript -->
        <p>Loading items...</p>
      </div>
    </main>

    <script src="/js/lost-found.js"></script>
  </body>
</html>
