<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up — CampusX</title>
    <!-- We will style this later, but let's link the CSS file now -->
    <link rel="stylesheet" href="/css/auth.css" />
  </head>
  <body>
    <div class="auth-container">
      <h2>Join CampusX</h2>
      <p>Create your account to access campus services.</p>
      
      <form id="signupForm">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" required placeholder="Himanshu" />
        </div>

        <div class="form-group">
          <label for="email">College Email</label>
          <input type="email" id="email" required placeholder="student@campusx.edu" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="••••••••" />
        </div>

        <button type="submit">Create Account</button>
      </form>
      
      <p class="auth-links">
        Already have an account? <a href="/pages/login.html">Log in here</a>
      </p>
    </div>

    <!-- This links your frontend to the API! -->
    <script src="/js/auth.js"></script>
  </body>
</html>
