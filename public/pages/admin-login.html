<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Gateway — CampusMate</title>
    <style>
        body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: #0f172a; display: flex; align-items: center; justify-content: center; height: 100vh; color: #f8fafc; }
        .login-box { background: #1e293b; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 400px; border-top: 4px solid #ef4444; }
        h1 { margin: 0 0 10px 0; font-size: 24px; text-align: center; color: #ef4444; }
        p { text-align: center; color: #94a3b8; margin-bottom: 30px; font-size: 14px; }
        
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #cbd5e1; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: white; font-family: inherit; box-sizing: border-box; }
        input:focus { outline: none; border-color: #ef4444; }
        
        button { width: 100%; background: #ef4444; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #dc2626; }
        
        #errorMsg { color: #fca5a5; text-align: center; margin-top: 15px; font-size: 14px; min-height: 20px; }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>🛡️ Admin Gateway</h1>
        <p>Restricted Access. Authorized personnel only.</p>

        <form id="adminLoginForm">
            <div class="input-group">
                <label for="email">Admin Email</label>
                <input type="email" id="email" required autocomplete="off">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit">Authenticate</button>
            <div id="errorMsg"></div>
        </form>
    </div>

    <script src="/js/admin-login.js"></script>
</body>
</html>
